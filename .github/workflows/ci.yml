name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_llm_integration:
        description: "Run LLM-driven integration tests (requires ZHIPU_API_KEY secret)"
        type: boolean
        default: false

jobs:
  unit:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install bubblewrap (Linux sandbox)
        # The server runner refuses to spawn tasks unsandboxed; on
        # ubuntu-latest bwrap isn't pre-installed. Without this,
        # tests/server.runner.test.ts and tests/server.mcp.test.ts
        # all fail at submit_task. Adds <2s to the run.
        #
        # Ubuntu 24.04+ (which ubuntu-latest now points at) ships an
        # AppArmor profile that denies unprivileged user-namespace
        # creation by default — bwrap exits with "setting up uid
        # map: Permission denied". The sysctl below opts the runner
        # back into the pre-24.04 behavior so bwrap can sandbox.
        # See: https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (LLM integration excluded)
        run: npm test -- --exclude '**/*.integration.test.ts'

  llm-integration:
    name: LLM-driven integration tests
    # Manual trigger only — costly + non-deterministic. Set the
    # `run_llm_integration` input to `true` when dispatching.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_llm_integration == 'true'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: LLM integration tests
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: npm test -- '**/*.integration.test.ts'
